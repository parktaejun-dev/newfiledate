<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#iconGrad)" stroke-width="8" stroke-opacity="0.3" />

  <!-- Outer Time Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#iconGrad)" stroke-width="24" stroke-dasharray="700 80" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Clock ticks -->
  <line x1="256" y1="116" x2="256" y2="132" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
  <line x1="396" y1="256" x2="380" y2="256" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="396" x2="256" y2="380" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
  <line x1="116" y1="256" x2="132" y2="256" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />

  <!-- Clock Hands (Time Weaver) -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="256" x2="328" y2="256" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
  
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="20" fill="#ffffff" />
  <circle cx="256" cy="256" r="10" fill="#6366f1" />
</svg>